[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run build --workspace=frontend",
  "npm run build --workspace=backend"
]

[phases.setup]
cmds = ["echo 'Verifying build outputs...'", "ls -la frontend/dist 2>/dev/null || echo 'WARNING: frontend/dist not found'", "ls -la backend/dist 2>/dev/null || echo 'WARNING: backend/dist not found'"]

[start]
cmd = "npm start"
