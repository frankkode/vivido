<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chess King -->
  <g transform="translate(256, 256)" fill="white">
    <!-- Cross on top -->
    <rect x="-8" y="-140" width="16" height="40" rx="4"/>
    <rect x="-20" y="-128" width="40" height="16" rx="4"/>

    <!-- Crown -->
    <path d="M -50,-80 L -40,-100 L -20,-85 L 0,-100 L 20,-85 L 40,-100 L 50,-80 L 50,-60 L -50,-60 Z"/>

    <!-- Head -->
    <ellipse cx="0" cy="-40" rx="45" ry="20"/>

    <!-- Body -->
    <path d="M -45,-40 L -35,40 L -40,60 L 40,60 L 35,40 L 45,-40 Z"/>

    <!-- Base -->
    <rect x="-60" y="60" width="120" height="20" rx="4"/>
    <rect x="-70" y="80" width="140" height="15" rx="4"/>
  </g>
</svg>
